<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Meva Biblioteca Cozy</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Capçalera -->
        <header class="header-principal">
            <h1>📖 La Meva Biblioteca</h1>
            <p>El teu racó de lectura</p>
        </header>

        <!-- Contingut de les Seccions -->
        <main class="contingut-principal">
            
            <!-- Secció Biblioteca -->
            <section id="seccio-biblioteca" class="seccio activa">
                <div class="accions-bar">
                    <input type="text" id="cercador-llibres" placeholder="Buscar per títol o autor...">
                    <button id="btn-obrir-modal" class="boto-afegir">+ Afegir</button>
                </div>

                <div class="pestanyes-filtre">
                    <button class="pestanya activa" data-filtre="tots">Tots</button>
                    <button class="pestanya" data-filtre="pendent">Llegint</button>
                    <button class="pestanya" data-filtre="completat">Llegits</button>
                    <button class="pestanya" data-filtre="desitjos">Deseos</button>
                </div>

                <div id="llista-llibres" class="llista-cards">
                    <!-- Es carregarà dinàmicament -->
                </div>
            </section>

            <!-- Secció Social / Amics -->
            <section id="seccio-social" class="seccio">
                <h2>Comunitat i Amics</h2>
                <div class="cercador-usuaris">
                    <input type="text" id="input-cercar-amic" placeholder="Buscar amics pel nom...">
                    <button id="btn-cercar-amic" class="boto-secundari">Buscar</button>
                </div>
                
                <h3>Sol·licituds pendents</h3>
                <div id="llista-sollicituds" class="llista-cards">
                    <!-- Sol·licituds d'amistat -->
                </div>

                <h3>Els meus amics</h3>
                <div id="llista-amics" class="llista-cards">
                    <!-- Llista d'amics -->
                </div>
            </section>

            <!-- Secció Perfil -->
            <section id="seccio-perfil" class="seccio">
                <h2>El meu Perfil</h2>
                <div class="perfil-targeta">
                    <div class="perfil-header">
                        <span class="avatar-gran">📖</span>
                        <div>
                            <h3 id="nom-usuari-perfil">Usuari Reader</h3>
                            <p id="correu-perfil">lector@cozy.com</p>
                        </div>
                    </div>
                </div>
                
                <div class="estadistiques-grid">
                    <div class="estat-card">
                        <span id="estat-llegits">0</span>
                        <label>Llegits</label>
                    </div>
                    <div class="estat-card">
                        <span id="estat-pendents">0</span>
                        <label>En procés</label>
                    </div>
                </div>
            </section>
        </main>

        <!-- Barra de Navegació Inferior (Bottom Bar) -->
        <nav class="nav-inferior">
            <button class="boto-nav actiu" data-seccio="seccio-biblioteca">
                <span class="icona">📚</span>
                <span class="text-nav">Llibres</span>
            </button>
            <button class="boto-nav" data-seccio="seccio-social">
                <span class="icona">👥</span>
                <span class="text-nav">Social</span>
            </button>
            <button class="boto-nav" data-seccio="seccio-perfil">
                <span class="icona">👤</span>
                <span class="text-nav">Perfil</span>
            </button>
        </nav>
    </div>

    <!-- Modal per Afegir Llibre -->
    <div id="modal-llibre" class="modal">
        <div class="modal-contingut">
            <h3>Afegir nou llibre</h3>
            <input type="text" id="input-titol" placeholder="Títol del llibre">
            <input type="text" id="input-autor" placeholder="Autor">
            <select id="select-estat">
                <option value="pendent">Llegint</option>
                <option value="completat">Llegit</option>
                <option value="desitjos">Llista de desitjos</option>
            </select>
            <label class="boto-pujar-imatge">
                📷 Pujar portada
                <input type="file" id="input-portada" accept="image/*" class="input-ocult">
            </label>
            <div class="modal-accions">
                <button id="btn-cancelar" class="boto-secundari">Cancelar</button>
                <button id="btn-guardar-llibre" class="boto-guardar">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
